<!-- Webflow Home: replace the complete Social Landing Embed with this markup.
     Keep UI + TRANSLATIONS + CONFIG, Triage, all.banks and webflow bridge.
     Keep exactly one current engine loader in the separate Engine embed.
     Language selection, prices, consent and analytics are owned by that engine. -->
<style>
  :root {
    --nm-blue:#1197d5;
    --nm-blue-dark:#0b86bf;
    --nm-orange:#ff7a00;
    --nm-green:#72be00;
    --nm-bg:#f6fbff;
    --nm-text:#1f2937;
    --nm-muted:#667085;
    --nm-border:#e5e7eb;
    --nm-white:#ffffff;
  }

  .nm-social-landing {
    font-family:Inter,Arial,sans-serif;
    background:var(--nm-bg);
    color:var(--nm-text);
    padding-bottom:92px;
  }

  .nm-container {
    max-width:680px;
    margin:0 auto;
    padding:0 20px;
  }

  .nm-topbar {
    position:sticky;
    top:0;
    z-index:9997;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    background:#fff;
    border-bottom:1px solid var(--nm-border);
  }

  .nm-topbar-logo {
    height:46px;
    width:auto;
    display:block;
  }

  .nm-open-lang-btn {
    border:1px solid #d7eef9;
    background:#f6fbff;
    border-radius:999px;
    padding:9px 13px;
    font-size:13px;
    font-weight:850;
    cursor:pointer;
    white-space:nowrap;
  }

  .nm-alert {
    display:none;
    background:#fff4e8;
    color:#9a3412;
    font-size:13px;
    text-align:center;
    padding:10px 16px;
    border-bottom:1px solid #ffd2a6;
  }

  .nm-alert.is-visible { display:block; }
  .nm-section { padding:34px 0; }

  .nm-hero {
    padding:42px 0 30px;
    text-align:center;
  }

  .nm-logo-mark {
    width:62px;
    height:62px;
    margin:0 auto 18px;
    position:relative;
  }

  .nm-logo-dot { position:absolute; border-radius:999px; }
  .nm-logo-dot.blue { width:34px;height:34px;background:var(--nm-blue);left:0;top:4px; }
  .nm-logo-dot.orange { width:34px;height:34px;background:var(--nm-orange);right:0;top:4px; }
  .nm-logo-dot.green { width:18px;height:18px;background:var(--nm-green);left:22px;bottom:4px; }

  .nm-eyes {
    position:absolute;
    left:12px;
    top:16px;
    width:38px;
    height:10px;
    display:flex;
    justify-content:space-between;
    z-index:2;
  }

  .nm-eyes span {
    width:7px;
    height:7px;
    background:#fff;
    border-radius:999px;
  }

  .nm-hero-title {
    font-size:31px;
    line-height:1.12;
    letter-spacing:0;
    font-weight:850;
    margin:0;
  }

  .nm-hero-sub {
    font-size:17px;
    line-height:1.5;
    color:#475467;
    margin:15px 0 24px;
  }

  .nm-btn {
    display:block;
    width:100%;
    box-sizing:border-box;
    border:0;
    cursor:pointer;
    background:linear-gradient(135deg,var(--nm-blue),var(--nm-blue-dark));
    color:#fff !important;
    border-radius:16px;
    padding:17px 18px;
    font-size:18px;
    font-weight:850;
    text-align:center;
    box-shadow:0 12px 26px rgba(17,151,213,.28);
  }

  .nm-btn:active { transform:scale(.985); }
  .nm-btn:disabled { opacity:.7; cursor:wait; }

  .nm-microcopy {
    font-size:13px;
    color:var(--nm-muted);
    margin:12px 0 0;
  }

  .nm-trust-row {
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
    margin-top:20px;
  }

  .nm-trust-pill {
    background:#fff;
    border:1px solid #d7eef9;
    border-radius:999px;
    padding:10px 12px;
    font-size:14px;
    color:#344054;
  }

  .nm-card {
    background:#fff;
    border:1px solid var(--nm-border);
    border-radius:24px;
    padding:22px;
    box-shadow:0 12px 30px rgba(31,41,55,.06);
  }

  .nm-card.orange-left { border-left:7px solid var(--nm-orange); }
  .nm-card.green-left { border-left:7px solid var(--nm-green); }

  .nm-section-title {
    font-size:24px;
    line-height:1.2;
    font-weight:850;
    margin:0 0 16px;
    letter-spacing:0;
  }

  .nm-value-list {
    list-style:none;
    padding:0;
    margin:0;
  }

  .nm-value-list li {
    font-size:16px;
    line-height:1.5;
    padding:11px 0;
    border-bottom:1px solid #f0f2f5;
  }

  .nm-value-list li:last-child { border-bottom:none; }

  .nm-steps-list { display:grid; gap:12px; }

  .nm-step {
    background:#fff;
    border-left:6px solid var(--nm-orange);
    border-radius:17px;
    padding:16px;
    font-size:16px;
    font-weight:750;
    box-shadow:0 8px 20px rgba(31,41,55,.05);
  }

  .nm-preview-box {
    background:#fff;
    border:1px dashed var(--nm-blue);
    border-radius:24px;
    padding:24px;
    text-align:center;
  }

  .nm-preview-mock {
    background:linear-gradient(180deg,#f1faff,#fff);
    border:1px solid #d7eef9;
    border-radius:18px;
    padding:22px;
    text-align:left;
  }

  .nm-preview-header {
    height:42px;
    border-radius:14px;
    background:linear-gradient(90deg,var(--nm-blue),var(--nm-orange));
    margin-bottom:18px;
  }

  .nm-preview-line {
    height:10px;
    background:#d7eef9;
    border-radius:999px;
    margin:10px 0;
  }

  .nm-preview-line.short {
    width:62%;
    background:#ffd2a6;
  }

  .nm-caption {
    font-size:13px;
    color:var(--nm-muted);
    margin:12px 0 0;
  }

  .nm-trust-text {
    font-size:16px;
    line-height:1.65;
    color:#344054;
    margin:0;
  }

  .nm-price {
    font-size:38px;
    font-weight:900;
    color:var(--nm-blue);
    margin-bottom:16px;
    letter-spacing:0;
  }

  .nm-sticky-cta {
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:9998;
    background:rgba(255,255,255,.97);
    border-top:1px solid var(--nm-border);
    padding:12px 16px;
    backdrop-filter:blur(10px);
  }

  .nm-sticky-cta-inner {
    max-width:680px;
    margin:0 auto;
  }

  .nm-questionnaire-shell {
    font-family:Inter,Arial,sans-serif;
    background:#fff;
  }

  .nm-q-card {
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:20px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 10px 26px rgba(31,41,55,.06);
  }

  .nm-q-number {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:28px;
    height:28px;
    border-radius:999px;
    background:#f0f9ff;
    color:#1197d5;
    font-weight:900;
    font-size:13px;
    margin-bottom:10px;
  }

  .nm-q-text {
    font-size:16px;
    line-height:1.5;
    font-weight:750;
    color:#1f2937;
    margin-bottom:12px;
  }

  .nm-answer-select {
    width:100%;
    padding:13px 14px;
    border-radius:14px;
    border:1px solid #d7eef9;
    background:#f6fbff;
    color:#1f2937;
    font-size:15px;
    font-weight:700;
    outline:none;
  }

  .nm-answer-select:focus {
    border-color:#1197d5;
    box-shadow:0 0 0 4px rgba(17,151,213,.12);
  }

  .nm-step-title-card {
    background:linear-gradient(135deg,#f0f9ff,#ffffff);
    border:1px solid #d7eef9;
    border-radius:24px;
    padding:20px;
    margin-bottom:18px;
  }

  .nm-step-title-card h3 {
    margin:0 0 8px 0;
    font-size:24px;
    line-height:1.2;
    color:#1f2937;
  }

  .nm-step-title-card p {
    margin:0;
    color:#667085;
    line-height:1.55;
  }

  .nm-summary-card {
    background:#ffffff;
    border:1px solid #e5e7eb;
    border-radius:24px;
    padding:22px;
    box-shadow:0 14px 34px rgba(31,41,55,.08);
    margin-bottom:16px;
  }

  .nm-summary-hero {
    background:linear-gradient(135deg,#1197d5,#ff7a00);
    color:#ffffff;
    border-radius:22px;
    padding:22px;
    margin-bottom:16px;
  }

  .nm-summary-hero h3 {
    margin:0 0 8px 0;
    font-size:24px;
  }

  .nm-summary-pill {
    display:inline-flex;
    align-items:center;
    gap:6px;
    border-radius:999px;
    padding:8px 12px;
    background:#f0f9ff;
    border:1px solid #d7eef9;
    color:#1f2937;
    font-size:13px;
    font-weight:800;
    margin:4px 6px 4px 0;
  }

  .nm-summary-warning {
    background:#fff7ed;
    border:1px solid #ffd2a6;
    color:#7c2d12;
    border-radius:16px;
    padding:14px;
    font-size:14px;
    line-height:1.5;
  }

  @media (min-width:768px) {
    .nm-social-landing { padding-bottom:0; }
    .nm-hero-title { font-size:46px; }
    .nm-hero-sub { font-size:19px; }
    .nm-section { padding:52px 0; }
    .nm-trust-row { grid-template-columns:repeat(3,1fr); }
    .nm-sticky-cta { display:none; }
  }
</style>

<div class="nm-social-landing" id="nmSocialLanding">
  <div class="nm-alert" id="nmAlert"></div>

  <div class="nm-topbar">
    <img
      src="https://cdn.prod.website-files.com/69baae175c3312995bc93889/69c128ce0971cba9582bdb08_ChatGPT%20Image%202026.%20m%C3%A1rc.%2018.%2012_41_12.png"
      class="nm-topbar-logo"
      alt="NeuroMap Kids"
    />

    <button type="button" class="nm-open-lang-btn" id="nmOpenLangBtn">
      🌍 Language
    </button>
  </div>

  <section class="nm-section nm-hero">
    <div class="nm-container">
      <div class="nm-logo-mark" aria-hidden="true">
        <div class="nm-logo-dot blue"></div>
        <div class="nm-logo-dot orange"></div>
        <div class="nm-logo-dot green"></div>
        <div class="nm-eyes"><span></span><span></span></div>
      </div>

      <h1 class="nm-hero-title" data-nm-i18n="heroTitle"></h1>
      <p class="nm-hero-sub" data-nm-i18n="heroSub"></p>

      <button type="button" class="nm-btn nm-start-btn" data-nm-i18n="primaryCta"></button>
      <p class="nm-microcopy" data-nm-i18n="microcopy"></p>

      <div class="nm-trust-row">
        <div class="nm-trust-pill" data-nm-i18n="trust1"></div>
        <div class="nm-trust-pill" data-nm-i18n="trust2"></div>
        <div class="nm-trust-pill" data-nm-i18n="trust3"></div>
      </div>
    </div>
  </section>

  <section class="nm-section">
    <div class="nm-container">
      <div class="nm-card orange-left">
        <h2 class="nm-section-title" data-nm-i18n="valueTitle"></h2>
        <ul class="nm-value-list">
          <li data-nm-i18n="value1"></li>
          <li data-nm-i18n="value2"></li>
          <li data-nm-i18n="value3"></li>
          <li data-nm-i18n="value4"></li>
        </ul>
      </div>
    </div>
  </section>

  <section class="nm-section">
    <div class="nm-container">
      <h2 class="nm-section-title" data-nm-i18n="stepsTitle"></h2>
      <div class="nm-steps-list">
        <div class="nm-step" data-nm-i18n="step1"></div>
        <div class="nm-step" data-nm-i18n="step2"></div>
        <div class="nm-step" data-nm-i18n="step3"></div>
      </div>
    </div>
  </section>

  <section class="nm-section">
    <div class="nm-container">
      <h2 class="nm-section-title" data-nm-i18n="previewTitle"></h2>
      <div class="nm-preview-box">
        <div class="nm-preview-mock">
          <div class="nm-preview-header"></div>
          <div class="nm-preview-line short"></div>
          <div class="nm-preview-line"></div>
          <div class="nm-preview-line"></div>
          <div class="nm-preview-line short"></div>
          <div class="nm-preview-line"></div>
        </div>
        <p class="nm-caption" data-nm-i18n="previewCaption"></p>
      </div>
    </div>
  </section>

  <section class="nm-section">
    <div class="nm-container">
      <div class="nm-card green-left">
        <h2 class="nm-section-title" data-nm-i18n="trustTitle"></h2>
        <p class="nm-trust-text" data-nm-i18n="trustText"></p>
      </div>
    </div>
  </section>

  <section class="nm-section">
    <div class="nm-container">
      <div class="nm-card" style="text-align:center;">
        <h2 class="nm-section-title" data-nm-i18n="priceTitle"></h2>
        <div class="nm-price" data-nm-i18n="priceValue"></div>
        <button type="button" class="nm-btn nm-start-btn" data-nm-i18n="priceCta"></button>
        <p class="nm-microcopy" data-nm-i18n="priceMicrocopy"></p>
      </div>
    </div>
  </section>

  <div class="nm-sticky-cta">
    <div class="nm-sticky-cta-inner">
      <button type="button" class="nm-btn nm-start-btn" data-nm-i18n="stickyCta"></button>
    </div>
  </div>
</div>

<div id="questionnaireStart" data-scroll-target="questionnaireStart" style="position:relative;top:-20px;width:1px;height:1px;"></div>

<div id="nmApp" data-scroll-target="questionnaireStart" class="nm-questionnaire-shell" style="display:none;padding:20px;max-width:820px;margin:auto;">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
    <h2 id="brandTitle" style="margin:0;">NeuroMap Kids</h2>
    <button id="langSwitch" type="button">HU</button>
  </div>

  <h1 id="pageTitle" style="margin-top:24px;">Kérdőív indítása</h1>
  <p id="pageIntro" style="color:#555;margin-top:0;"></p>

  <div id="identitySection" style="margin-top:20px;">
    <label id="labelName" for="name">Név</label>
    <input id="name" style="width:100%;padding:10px;margin-bottom:10px;" />

    <label id="labelEmail" for="email">Email</label>
    <input id="email" type="email" style="width:100%;padding:10px;margin-bottom:20px;" />
  </div>

  <div id="progressBarWrap" style="margin:16px 0 24px 0;">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#666;margin-bottom:8px;gap:12px;flex-wrap:wrap;">
      <span id="progressLabel">Lépés</span>
      <span id="progressText">1 / 3</span>
    </div>

    <div style="height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden;">
      <div id="progressBar" style="height:10px;width:33%;background:#111827;border-radius:999px;"></div>
    </div>
  </div>

  <div id="triageSection"></div>
  <div id="specificSection" style="display:none;"></div>
  <div id="summarySection" style="display:none;"></div>

  <div id="checkoutStatus" style="margin-top:16px;font-size:14px;color:#444;"></div>

  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px;">
    <button id="backBtn" type="button" style="padding:14px 20px;display:none;">Vissza</button>
    <button id="nextBtn" type="button" style="padding:14px 20px;">Tovább</button>
    <button id="paymentBtn" type="button" style="padding:14px 20px;display:none;">Fizetés</button>
  </div>
</div>
