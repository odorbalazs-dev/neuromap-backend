name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: neuromap_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neuromap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: |
          node --check src/app/server.js
          node --check src/services/stripe.service.js
          node --check src/services/questionnaire-integrity.service.js
          node --check src/services/analysis.service.js
          node --check src/services/email.service.js
          node --check src/services/webhook.service.js
          node --check public/webflow/engine.js
          node --check public/webflow/checkout-pages.js
          node --check public/admin-dashboard.js

      - name: Product audits and smoke checks
        run: npm run audit:all

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Go-live unit checks
        run: |
          npm run smoke:consent-security
          node scripts/smoke-go-live.js
          node scripts/smoke-invoice-payment-policy.js

      - name: Isolated PostgreSQL integration
        env:
          DATABASE_TEST_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/neuromap_ci
        run: |
          node scripts/integration-go-live.js
          node scripts/integration-consent-security.js
